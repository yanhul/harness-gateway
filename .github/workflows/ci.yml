name: Gateway CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          python -m py_compile gateway.py test_gateway.py
          node --check cloudflare/src/index_v2.js
      - name: Security tests
        run: python -m unittest -v
      - name: Cloudflare smoke tests
        run: node --test cloudflare/test_index.mjs cloudflare/test_parity.mjs
